# SovereignAI Workbench — host nginx reverse proxy (NATIVE deploy path).
# (Docker path uses frontend/nginx.conf inside the container instead.)
#
# Install: sudo cp deploy/nginx-sovereign-ai.conf /etc/nginx/sites-available/sovereign-ai
#          sudo ln -s /etc/nginx/sites-available/sovereign-ai /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Replace workbench.example.com with your domain, then run Certbot on the
# server (no certificates or keys are committed here, and none are faked):
#   sudo certbot --nginx -d workbench.example.com
# Static frontend is served from the Vite build: frontend/dist.
# NOTE: exactly ONE upstream block and ONE server block must exist in this
# file (a duplicated upstream name fails `nginx -t`).

upstream sov_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name workbench.example.com;

    # Certbot (or your redirect) owns port 80 once HTTPS is active.
    # Uncomment after certificates exist to force HTTPS:
    # return 301 https://$host$request_uri;

    # --- HTTPS listener (managed by Certbot; template, inactive until certs exist) ---
    # server {
    #     listen 443 ssl;
    #     server_name workbench.example.com;
    #     ssl_certificate     /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;
    #     # HSTS ONLY here, only once HTTPS is actually serving. Never claim
    #     # HTTPS before this block is live:
    #     # add_header Strict-Transport-Security "max-age=31536000" always;
    #     ... (same locations as below) ...
    # }

    # Frontend build output
    root /opt/sovereign-ai-workbench/frontend/dist;
    index index.html;

    # REST API (no dev docs in production path needed; served under /api/*)
    location /api/ {
        proxy_pass http://sov_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: task stream + network monitor
    location /ws/ {
        proxy_pass http://sov_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness probe (unauthenticated, no secrets)
    location = /health {
        proxy_pass http://sov_backend;
    }

    # SPA fallback (hash routing; deep links fall back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
