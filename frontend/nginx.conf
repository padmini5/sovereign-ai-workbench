# Production frontend: static dist + reverse proxy to the backend.
# Same-origin /api + /ws keep the browser threat model identical to dev.
# TLS is terminated by the host reverse proxy (see deploy/nginx-sovereign-ai.conf
# + certbot step). This container only speaks plain HTTP on 8080 behind it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for static assets (API adds its own).
    # NOTE: no HSTS here — HSTS belongs on the outer HTTPS listener only,
    # once certificates are installed server-side via Certbot. Sending HSTS
    # over plain HTTP would be both ineffective and dishonest.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
